<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - Kairat</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background-color: #faf9f6;
        }

        .confirmation-box {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 15px;
            padding: 45px 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 40px;
        }

        .order-number {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
        }

        .kairat-btn {
            background-color: #c5a572;
            border: none;
            color: white;
        }

        .kairat-btn:hover {
            background-color: #a5865c;
            color: white;
        }

        @media (max-width: 576px) {
            .confirmation-box {
                margin: 30px 15px;
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="confirmation-box text-center">

        <div class="success-icon mb-4">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1 class="fw-bold">Order Confirmed!</h1>

        <p class="text-muted mt-3">
            Thank you for shopping with Kairat.
            Your order has been placed successfully.
        </p>

        <div class="order-number my-4">
            <strong>Order number:</strong>
            <span id="order-number"></span>
        </div>

        <div class="text-start">

            <div class="d-flex justify-content-between py-2">
                <span>Items</span>
                <span id="items-total">$0.00</span>
            </div>

            <div class="d-flex justify-content-between py-2">
                <span>Shipping</span>
                <span id="shipping-total">$0.00</span>
            </div>

            <div class="d-flex justify-content-between py-2">
                <span>Tax</span>
                <span id="tax-total">$0.00</span>
            </div>

            <hr>

            <div class="d-flex justify-content-between fs-5 fw-bold">
                <span>Order Total</span>
                <span id="order-total">$0.00</span>
            </div>

        </div>

        <p class="text-muted mt-4">
            Your items will be delivered according to the
            delivery options you selected.
        </p>

        <a href="index.html" class="btn kairat-btn w-100 py-3 mt-3">
            Continue Shopping
        </a>

    </div>

</div>

<script>
    const order = JSON.parse(localStorage.getItem("completedOrder"));

    if (order) {
        document.querySelector("#order-number").textContent =
            order.orderNumber;

        document.querySelector("#items-total").textContent =
            "$" + order.itemsTotal.toFixed(2);

        document.querySelector("#shipping-total").textContent =
            "$" + order.shipping.toFixed(2);

        document.querySelector("#tax-total").textContent =
            "$" + order.tax.toFixed(2);

        document.querySelector("#order-total").textContent =
            "$" + order.total.toFixed(2);
    }
</script>

</body>
</html>
