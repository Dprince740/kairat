<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - Kairat Jewelry</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8f7f4;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirmation-box {
            width: 100%;
            max-width: 600px;
            margin: 30px 15px;
            padding: 45px 35px;
            background: #fff;
            border: 1px solid #e2e0dc;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .brand {
            color: #b08a45;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .success-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        .confirmation-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .confirmation-text {
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .order-number {
            padding: 14px;
            background: #faf9f6;
            border: 1px solid #e5e2dc;
            border-radius: 9px;
            font-size: 15px;
        }

        .order-number span {
            color: #b08a45;
            font-weight: 700;
        }

        .order-details {
            margin-top: 25px;
            padding: 5px 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            color: #555;
        }

        .summary-row span:last-child {
            color: #222;
            font-weight: 600;
            white-space: nowrap;
        }

        .summary-row.total {
            color: #222;
            font-size: 20px;
            font-weight: 700;
        }

        .summary-row.total span:last-child {
            color: #b08a45;
            font-size: 22px;
        }

        .delivery-message {
            margin-top: 22px;
            padding: 14px;
            border-radius: 9px;
            background: #f8f7f4;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .kairat-btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #c5a572;
            color: #222;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .kairat-btn:hover {
            background: #b08a45;
            color: white;
            transform: translateY(-1px);
        }

        @media (max-width: 576px) {
            .confirmation-box {
                margin: 20px 12px;
                padding: 35px 20px;
            }

            .confirmation-title {
                font-size: 27px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
                font-size: 37px;
            }

            .summary-row {
                font-size: 14px;
            }

            .summary-row.total {
                font-size: 18px;
            }

            .summary-row.total span:last-child {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="confirmation-box text-center">

        <div class="brand">
            KAIRAT JEWELRY
        </div>

        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1 class="confirmation-title">
            Order Confirmed!
        </h1>

        <p class="confirmation-text">
            Thank you for shopping with Kairat Jewelry.
            Your order has been placed successfully.
        </p>

        <div class="order-number">
            <strong>Order number: </strong>
            <span id="order-number"></span>
        </div>

        <div class="order-details text-start">

            <div class="summary-row">
                <span>Items</span>
                <span id="items-total">$0.00</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="shipping-total">$0.00</span>
            </div>

            <div class="summary-row">
                <span>Tax</span>
                <span id="tax-total">$0.00</span>
            </div>

            <hr>

            <div class="summary-row total">
                <span>Order Total</span>
                <span id="order-total">$0.00</span>
            </div>

        </div>

        <div class="delivery-message">
            <i class="bi bi-truck me-1"></i>
            Your items will be delivered according to the
            delivery options you selected.
        </div>

        <a href="index.html" class="kairat-btn">
            Continue Shopping
        </a>

    </div>

    <script>
        const order = JSON.parse(
            localStorage.getItem("completedOrder")
        );

        if (order) {
            document.querySelector("#order-number").textContent =
                order.orderNumber;

            document.querySelector("#items-total").textContent =
                "$" + Number(order.itemsTotal).toFixed(2);

            document.querySelector("#shipping-total").textContent =
                "$" + Number(order.shipping).toFixed(2);

            document.querySelector("#tax-total").textContent =
                "$" + Number(order.tax).toFixed(2);

            document.querySelector("#order-total").textContent =
                "$" + Number(order.total).toFixed(2);
        }
    </script>

</body>
</html>
