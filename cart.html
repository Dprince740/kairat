<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="px-5">

    <div>

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mt-2 checkout-header">

            <a href="index.html" class="text-dark">
                <div>
                    <h1>Kairat</h1>
                </div>
            </a>

            <div>
                <h2 class="fs-2">
                    Checkout
                    (<span class="text-primary">
                        <span class="me-2 checkoutnum">0</span>
                        items
                    </span>)
                </h2>
            </div>

            <div>
                <i class="bi bi-lock fs-1"></i>
            </div>

        </div>


        <!-- MAIN CONTENT -->
        <div class="row m-0 p-0 mt-2">

            <!-- CART ITEMS -->
            <div class="col-12 col-md-7 mt-4 mb-4 px-4 display-html">
            </div>


            <!-- ORDER SUMMARY -->
            <div class="col-12 col-md-5 checkout">

                <div class="order-summary-box">

                    <h1 class="checkout-title">
                        Order Summary
                    </h1>


                    <div class="summary-row">
                        <div>
                            Items (<span class="summaryitem">0</span>)
                        </div>

                        <div class="summaryprice">
                            $0.00
                        </div>
                    </div>


                    <div class="summary-row">
                        <div>
                            Shipping &amp; handling
                        </div>

                        <div>
                            $<span class="shiping">0.00</span>
                        </div>
                    </div>


                    <div class="summary-row">
                        <div>
                            Total before tax
                        </div>

                        <div class="sumtotal">
                            $0.00
                        </div>
                    </div>


                    <div class="summary-row">
                        <div>
                            Estimated tax (10%)
                        </div>

                        <div class="est-tax">
                            $0.00
                        </div>
                    </div>


                    <hr>


                    <div class="summary-row order-total">
                        <div>
                            Order total
                        </div>

                        <div>
                            $<span class="totall">0.00</span>
                        </div>
                    </div>


                    <button class="btn mt-4 text-dark w-100 py-3 bg-warning border-0 fs-5 place-order">
                        Place your order
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script type="module" src="cart.js"></script>

</body>
    <script type="module" src="cart.js"></script>
</body>
</html>
